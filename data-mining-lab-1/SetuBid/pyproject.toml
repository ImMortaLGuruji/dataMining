[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "setubid"
version = "0.1.0"
description = "Production-grade tender notice deduplication pipeline for SetuBid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.9.0",
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
