version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-annapurna}
      POSTGRES_USER: ${POSTGRES_USER:-annapurna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annapurnapassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-annapurna} -d ${POSTGRES_DB:-annapurna}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: annapurna-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-annapurna}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-annapurnapassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytical-engine:
    image: python:3.11-slim
    container_name: annapurna-engine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-annapurna}
      POSTGRES_USER: ${POSTGRES_USER:-annapurna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annapurnapassword}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-annapurna}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-annapurnapassword}
      MINIO_BUCKET: ${MINIO_BUCKET:-annapurna-raw}
    volumes:
      - .:/app
      - ../exam:/exam:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir duckdb minio requests && tail -f /dev/null"

volumes:
  postgres_data:
  minio_data:
